<!doctype html><meta charset="utf-8"><title>Relief · проверка геометрии</title><style>body{font:15px system-ui;background:#20221f;color:#d0ef9e;padding:30px}p{padding:10px;border-bottom:1px solid #444}</style><h1>Проверка геометрии и экспорта</h1><div id="results"></div><script type="module">
import * as THREE from 'three';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';import{prepareAsset,buildBadge,disposeModel,importSVG}from'/src/geometry.js';
import{validateSVG}from'/src/validate-svg.js';
const settings={height:9,bevel:1.2,dome:3.25,roughness:.38,gloss:.45};const log=text=>{const p=document.createElement('p');p.textContent=text;document.getElementById('results').append(p)};try{
const guardSVG='<svg xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="80" height="60" fill="#33aaff" stroke="#888" stroke-width="6"/></svg>';const broken=importSVG(guardSVG);broken.regions=broken.regions.filter(r=>r.role!=='rim');let rejected=false;try{await validateSVG(guardSVG,broken);}catch{rejected=true;}if(!rejected)throw Error('Импорт с потерянной обводкой не был остановлен');log('PASS · Автопроверка останавливает импорт с потерянной обводкой');
const clippedSVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="-20" y="-20" width="140" height="140" fill="#33aaff"/><path d="M-20 50H120" stroke="#888" stroke-width="8"/></svg>';await validateSVG(clippedSVG,importSVG(clippedSVG));log('PASS · Граница viewBox сохраняется при импорте');
const whites=importSVG('<svg xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="5" fill="white"/><rect x="40" y="0" width="50" height="80" fill="#fff"/><circle cx="110" cy="20" r="5" fill="#33aaff"/></svg>');
if(whites.regions.some(r=>r.role!=='enamel'))throw Error('Белый цвет получил другой материал');
log('PASS · Маленькие и большие белые заливки — обычная эмаль');
const circle=prepareAsset({key:'circle',name:'Circle',viewBox:[0,0,304,304],regions:[{id:'circle',role:'enamel',color:{r:0,g:.5,b:1},paths:[{d:'M 252 152 A 100 100 0 1 1 52 152 A 100 100 0 1 1 252 152 Z',rule:'NONZERO'}]}]});
const loop=circle.regions[0].loops[0];let maxDeviation=0;
for(let i=0;i<loop.length;i++){const a=loop[i],b=loop[(i+1)%loop.length],r=Math.hypot((a.X+b.X)/2000-152,(a.Y+b.Y)/2000-152);maxDeviation=Math.max(maxDeviation,Math.abs(100-r));}
if(maxDeviation>.04)throw Error('Круг стал многоугольником: ошибка '+maxDeviation+' px');
log('PASS · Плавный круг: максимальная ошибка '+maxDeviation.toFixed(4)+' px, '+loop.length+' точек');
for(const key of ['robot','paw','meditation','car','sneaker']){const raw=await(await fetch('/assets/'+key+'.json')).json(),source=prepareAsset(raw);await validateSVG(raw.sourceSVG,source);log('PASS · '+key+' · автоматическая проверка импорта');const{model,metrics}=buildBadge(source,settings);model.updateMatrixWorld(true);let raised=0;for(const m of model.children){for(const attr of [m.geometry.attributes.position,m.geometry.attributes.normal])for(const v of attr.array)if(!Number.isFinite(v))throw Error(key+': неверная геометрия');m.geometry.computeBoundingBox();const b=m.geometry.boundingBox;if(b.min.x < -153||b.max.x>153||b.min.y< -153||b.max.y>153)throw Error(key+': вышел за границы');if(m.name==='enamel'&&b.min.z>4&&b.max.z-b.min.z>1)raised++;}if(!raised)throw Error(key+': нет выпуклых поверхностей');if(key==='robot'){const glb=await new GLTFExporter().parseAsync(model,{binary:true});if(glb.byteLength<10000)throw Error('Пустой GLB');log('PASS · GLB робота: '+Math.round(glb.byteLength/1024)+' КБ');}log('PASS · '+key+' · '+metrics.parts+' поверхностей · '+Math.round(metrics.triangles)+' треугольников · координаты и нормали корректны');disposeModel(model);await new Promise(r=>setTimeout(r,20));}
const ring=importSVG('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="#ffcc00" fill-rule="evenodd" d="M0 0H100V100H0Z M25 25V75H75V25Z" stroke="#888" stroke-width="3"/></svg>','Ring');const{model}=buildBadge(ring,settings);model.updateMatrixWorld(true);const ray=new THREE.Raycaster(new THREE.Vector3(0,0,3),new THREE.Vector3(0,0,-1));if(ray.intersectObject(model,true).length)throw Error('Импорт заполнил отверстие');log('PASS · SVG с отверстием и обводкой: отверстие сохранено');disposeModel(model);log('ГОТОВО · Все проверки пройдены');}catch(e){log('FAIL · '+e.stack);}
</script>
