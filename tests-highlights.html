<!doctype html><meta charset="utf-8"><title>Блики · сравнение</title><style>body{font:14px system-ui;background:#20221f;color:#eee}#comparison{display:flex;gap:16px}figure{margin:0;flex:1}canvas,img{width:100%}iframe{width:1280px;height:850px;border:0}</style><h1>Блики вдоль бортиков</h1><pre id="results"></pre><div id="comparison"></div><iframe></iframe><script type="module">
const frame=document.querySelector('iframe'),log=t=>document.querySelector('#results').textContent+=t+'\n',sleep=ms=>new Promise(r=>setTimeout(r,ms)),until=async(fn,label)=>{const start=performance.now();while(!fn()){if(performance.now()-start>90000)throw Error(label);await sleep(100)}};
window.testStorage=new Map();const html=await(await fetch('/')).text(),fixture=html.replace('<head>','<head><base href="/"><script>Object.defineProperty(window,"localStorage",{value:{getItem:k=>parent.testStorage.get(k)??null,setItem:(k,v)=>parent.testStorage.set(k,v)}});<\/script>');const $=id=>frame.contentDocument.getElementById(id),input=(id,v)=>{$(id).value=v;$(id).dispatchEvent(new frame.contentWindow.Event('input'))};
const snapshot=label=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=label;const source=frame.contentDocument.querySelector('#viewport canvas');canvas.width=source.width;canvas.height=source.height;canvas.getContext('2d').drawImage(source,0,0);figure.append(caption,canvas);document.querySelector('#comparison').append(figure)};
try{
 frame.srcdoc=fixture;await until(()=>frame.contentWindow.reliefMetrics?.key==='robot','Нет модели');const assetKey=new URLSearchParams(location.search).get('asset')||'robot';if(assetKey!=='robot'){frame.contentDocument.querySelector('[data-asset="'+assetKey+'"]').click();await until(()=>frame.contentWindow.reliefMetrics?.key===assetKey,'Нет выбранного макета');}const triangles=frame.contentWindow.reliefMetrics.triangles;
 input('rimHighlight',0);await until(()=>parseInt($('samples').textContent)>=16,'Нет рендера до');snapshot('Без добавленного блика · 0%');
 input('rimHighlight',1);input('rimHighlightWidth',.1);await until(()=>parseInt($('samples').textContent)>=16,'Нет узкого блика');snapshot('Блик 100% · ширина 10%');
 input('rimHighlightWidth',.9);await until(()=>parseInt($('samples').textContent)>=16,'Нет широкого блика');snapshot('Блик 100% · ширина 90%');
 const fig=document.createElement('figure');fig.innerHTML='<figcaption>ImageGen</figcaption><img src="/assets/'+assetKey+'-reference.png">';document.querySelector('#comparison').append(fig);
 if(frame.contentWindow.reliefMetrics.triangles!==triangles)throw Error('Блик изменил геометрию');const saved=JSON.parse(window.testStorage.get('relief-appearance-v1'));if(saved.rimHighlight!==1||saved.rimHighlightWidth!==.9)throw Error('Не сохранились настройки');
 log('PASS · Физический рендер до/после, геометрия неизменна, настройки сохранены');frame.hidden=true;
}catch(e){log('FAIL '+e.stack)}
</script>
