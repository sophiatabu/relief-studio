<!doctype html><meta charset="utf-8"><title>Контроль бортиков</title><style>body{background:#222;color:#eee;font:14px system-ui}section{margin:24px 12px}canvas{width:290px;height:290px;margin-right:10px;background:#000}p{max-width:1000px}</style><h1>Вектор → разбор → объём</h1><p>Белый — совпадение. Красный — добавлено. Голубой — потеряно. Слева исходник, затем разбор вектора и объём с фаской.</p><div id="results"></div><script type="module">
import * as THREE from 'three';import{prepareAsset,buildBadge,disposeModel}from'/src/geometry.js';
const N=1024,k=N/304,renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(N,N);renderer.setClearColor(0);const camera=new THREE.OrthographicCamera(-1.52,1.52,1.52,-1.52,.01,50);camera.position.z=7;camera.lookAt(0,0,0);const material=new THREE.MeshBasicMaterial({color:0xffffff});
function canvas(){const c=document.createElement('canvas');c.width=c.height=N;return c}
function data(c){return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,N,N).data}
function compare(a,b){const out=canvas(),ctx=out.getContext('2d'),img=ctx.createImageData(N,N);let missing=0,extra=0,area=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,A=a[4*i]>127,B=b[4*i]>127;area+=A;let edge=false;if(A!==B){for(let dy=-2;dy<=2&&!edge;dy++)for(let dx=-2;dx<=2;dx++){const j=(y+dy)*N+x+dx;if(j>=0&&j<N*N&&(a[j*4]>127)!==A){edge=true;break}}if(!edge){if(A)missing++;else extra++}}img.data.set(A&&B?[230,230,230,255]:A?[0,220,255,255]:B?[255,50,35,255]:[0,0,0,255],i*4)}ctx.putImageData(img,0,0);return{out,missing,extra,area}}
const fixtures=[
 ['joined-v','<svg xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#888" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10 L60 35"/><path d="M60 35 L110 10"/><path d="M60 35 L60 70"/></g></svg>'],
 ['masked-transform','<svg xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip"><rect x="5" y="5" width="90" height="90"/></clipPath></defs><g transform="translate(40 5) rotate(20) scale(1.3 .7)" clip-path="url(#clip)"><circle cx="50" cy="50" r="44" fill="#7352d2" stroke="#888" stroke-width="6"/><path d="M10 30 L95 65" stroke="#888" stroke-width="6" stroke-linecap="round"/><rect x="45" y="40" width="35" height="20" fill="white"/></g></svg>'],
 ['even-odd','<svg xmlns="http://www.w3.org/2000/svg"><path fill="#33aadd" fill-rule="evenodd" d="M0 0H100V100H0Z M20 20H80V80H20Z"/><path d="M5 5 L50 65 L95 5" fill="none" stroke="#888" stroke-width="8" stroke-linejoin="round"/><circle cx="50" cy="50" r="10" fill="white"/></svg>']
];
try{for(const key of ['robot','meditation','paw','car','sneaker',...fixtures.map(f=>f[0])]){
 const fixture=fixtures.find(f=>f[0]===key),raw=fixture?{key,name:key,sourceSVG:fixture[1]}:await(await fetch('/assets/'+key+'.json')).json(),asset=prepareAsset(raw),rimAsset={...asset,regions:asset.regions.filter(r=>r.role==='rim')};
 const original=canvas(),ctx=original.getContext('2d');
 if(raw.sourceSVG){const doc=new DOMParser().parseFromString(raw.sourceSVG,'image/svg+xml'),root=doc.documentElement;
 for(const node of root.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line'))if(!node.closest('defs,mask,clipPath')){if(node.getAttribute('fill')&&node.getAttribute('fill')!=='none')node.setAttribute('fill','black');if(node.getAttribute('stroke')&&node.getAttribute('stroke')!=='none')node.setAttribute('stroke','white');}
 const b=asset.sourceBounds,e=Math.max(b.maxX-b.minX,b.maxY-b.minY),span=e*304/240;
 root.setAttribute('viewBox',[(b.minX+b.maxX-span)/2,(b.minY+b.maxY-span)/2,span,span].join(' '));root.setAttribute('width',N);root.setAttribute('height',N);
 const image=new Image(),url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));image.src=url;await image.decode();ctx.drawImage(image,0,0);URL.revokeObjectURL(url);
 }else{ctx.scale(k,k);ctx.fillStyle='white';for(const r of raw.regions.filter(r=>r.role==='rim')){ctx.save();ctx.transform(...r.matrix);for(const p of r.paths)ctx.fill(new Path2D(p.d),p.rule==='EVENODD'?'evenodd':'nonzero');ctx.restore()}}
 const parsed=canvas(),pc=parsed.getContext('2d');pc.scale(k,k);pc.fillStyle='white';for(const r of rimAsset.regions){pc.beginPath();for(const l of r.loops){l.forEach((p,i)=>pc[i?'lineTo':'moveTo'](p.X/1000,p.Y/1000));pc.closePath()}pc.fill('nonzero')}
 const {model}=buildBadge(rimAsset,{height:9,sourceGeometry:true,rimWidthGain:0,bevel:Number(new URLSearchParams(location.search).get('bevel'))||1.2,dome:0,roughness:.38,gloss:.45});model.children[0].visible=false;model.children[1].visible=false;for(const m of model.children.slice(1)){m.material.dispose();m.material=new THREE.MeshBasicMaterial({color:0xffffff});}const scene=new THREE.Scene();scene.add(model);renderer.render(scene,camera);const rendered=canvas();rendered.getContext('2d').drawImage(renderer.domElement,0,0);const a=data(original),B=compare(a,data(parsed)),C=compare(a,data(rendered));const row=document.createElement('section'),p=document.createElement('p');p.textContent=key+': разбор +'+B.extra+' / −'+B.missing+'; фаска +'+C.extra+' / −'+C.missing+'; площадь '+B.area;if(B.extra||B.missing||C.extra||C.missing)p.textContent='FAIL · '+p.textContent;else p.textContent='PASS · '+p.textContent;row.append(p,original,B.out,C.out);document.querySelector('#results').append(row);disposeModel(model);await new Promise(r=>setTimeout(r,20));
}const p=document.createElement('p');p.textContent='ГОТОВО';document.querySelector('#results').append(p);renderer.dispose();}catch(e){document.querySelector('#results').append('FAIL: '+e.stack)}
</script>
